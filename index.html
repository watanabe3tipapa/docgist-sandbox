<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <link rel="icon" href="favicon.ico" />
        <title>DocGist</title>

        <!-- Modern CSS -->
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet"
        />
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
        />
        <link
            href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css"
            rel="stylesheet"
        />
        <link
            href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/neo.min.css"
            rel="stylesheet"
        />
        <link
            href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/elegant.min.css"
            rel="stylesheet"
        />
        <link
            href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/midnight.min.css"
            rel="stylesheet"
        />
        <link
            href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/default.min.css"
            rel="stylesheet"
        />
        <link
            href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/darkula.min.css"
            rel="stylesheet"
            class="dark"
        />

        <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css?family=Open+Sans:300,300italic,400,400italic,600,600italic%7CNoto+Serif:400,400italic,700,700italic%7CDroid+Sans+Mono:400"
        />

        <!-- Project specific styles -->
        <link
            rel="stylesheet"
            href="style/asciidoctor.css"
            id="theme-stylesheet"
        />
        <link rel="stylesheet" href="style/docgist-extra.css" />
    </head>
    <body>
        <nav
            id="main-menu"
            class="navbar navbar-expand-lg navbar-light bg-light"
        >
            <div class="container-fluid">
                <a class="navbar-brand" href="./">
                    <i class="fa-solid fa-square-pen"></i> DocGist
                </a>
                <button
                    class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#main-menu-items"
                    aria-controls="main-menu-items"
                    aria-expanded="false"
                    aria-label="Toggle navigation"
                >
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="main-menu-items">
                    <ul
                        class="navbar-nav me-auto mb-2 mb-lg-0"
                        id="navbar-buttons"
                    >
                        <li class="nav-item dropdown" id="file-button">
                            <a
                                class="nav-link dropdown-toggle"
                                href="#"
                                id="file-dropdown"
                                role="button"
                                data-bs-toggle="dropdown"
                                aria-expanded="false"
                                title="Create, edit, save and open documents"
                            >
                                <i class="fa-regular fa-file-lines"></i> File
                            </a>
                            <ul
                                class="dropdown-menu"
                                aria-labelledby="file-dropdown"
                                id="file-menu"
                            >
                                <li id="source-button" class="disabled">
                                    <a
                                        id="gist-link"
                                        class="dropdown-item"
                                        href="#"
                                        target="_blank"
                                        title="See the source document rendered on this page"
                                    >
                                        <i
                                            class="fa-fw fa-regular fa-file-lines"
                                        ></i>
                                        View source
                                    </a>
                                </li>
                                <li role="separator" class="divider"></li>
                                <li class="dropdown-header">
                                    Recent documents
                                </li>
                            </ul>
                        </li>

                        <li class="nav-item">
                            <a
                                class="nav-link disabled"
                                id="edit-button"
                                href="#"
                            >
                                <i class="fa-fw fa-solid fa-pencil"></i> Edit
                            </a>
                        </li>

                        <li class="nav-item dropdown" id="theme-button">
                            <a
                                class="nav-link dropdown-toggle"
                                href="#"
                                id="theme-dropdown"
                                role="button"
                                data-bs-toggle="dropdown"
                                aria-expanded="false"
                                title="Load theme stylesheet"
                            >
                                <i class="fa-solid fa-paintbrush"></i> Theme
                            </a>
                            <ul
                                class="dropdown-menu"
                                aria-labelledby="theme-dropdown"
                                id="theme-menu"
                            ></ul>
                        </li>

                        <li class="nav-item dropdown" id="highlighter-button">
                            <a
                                class="nav-link dropdown-toggle"
                                href="#"
                                id="highlight-dropdown"
                                role="button"
                                data-bs-toggle="dropdown"
                                aria-expanded="false"
                                title="Choose syntax highlighter for source code"
                            >
                                <i class="fa-solid fa-code"></i> Highlight
                            </a>
                            <ul
                                class="dropdown-menu"
                                aria-labelledby="highlight-dropdown"
                                id="highlighter-menu"
                            ></ul>
                        </li>

                        <li class="nav-item dropdown" id="attributes-button">
                            <a
                                class="nav-link dropdown-toggle"
                                href="#"
                                id="attributes-dropdown"
                                role="button"
                                data-bs-toggle="dropdown"
                                aria-expanded="false"
                                title="Attributes to set or unset"
                            >
                                <i class="fa-solid fa-gear"></i> Attributes
                            </a>
                            <ul
                                class="dropdown-menu"
                                aria-labelledby="attributes-dropdown"
                                id="attributes-menu"
                            ></ul>
                        </li>

                        <li class="nav-item dropdown">
                            <a
                                class="nav-link dropdown-toggle"
                                href="#"
                                id="share-dropdown"
                                role="button"
                                data-bs-toggle="dropdown"
                                aria-expanded="false"
                                title="Share this page"
                            >
                                <i class="fa-solid fa-share"></i> Share
                            </a>
                            <ul
                                class="dropdown-menu"
                                aria-labelledby="share-dropdown"
                            >
                                <li>
                                    <a
                                        id="twitter-share"
                                        class="dropdown-item"
                                        href=""
                                        target="_blank"
                                        data-toggle="tooltip"
                                        title="Tweet"
                                    >
                                        <i
                                            class="fa-fw fa-brands fa-square-twitter"
                                        ></i>
                                        Twitter
                                    </a>
                                </li>
                                <li>
                                    <a
                                        id="facebook-share"
                                        class="dropdown-item"
                                        href=""
                                        target="_blank"
                                        data-toggle="tooltip"
                                        title="Share link on Facebook"
                                    >
                                        <i
                                            class="fa-fw fa-brands fa-square-facebook"
                                        ></i>
                                        Facebook
                                    </a>
                                </li>
                                <li>
                                    <a
                                        id="google-plus-share"
                                        class="dropdown-item"
                                        href=""
                                        target="_blank"
                                        data-toggle="tooltip"
                                        title="Share link on Google+"
                                    >
                                        <i
                                            class="fa-fw fa-brands fa-square-google-plus"
                                        ></i>
                                        Google+
                                    </a>
                                </li>
                            </ul>
                        </li>
                    </ul>
                    <form class="d-flex">
                        <div class="input-group">
                            <span class="input-group-text"
                                ><i class="fa-solid fa-link"></i
                            ></span>
                            <input
                                type="text"
                                class="form-control"
                                id="gist-id"
                                placeholder="GitHub Gist/File / Dropbox URL"
                            />
                        </div>
                    </form>
                </div>
            </div>
        </nav>

        <div id="editor-wrapper">
            <textarea id="editor" style="display: none"></textarea>
        </div>

        <div id="content-wrapper">
            <div id="content">
                <img
                    alt="loading"
                    src="images/loading.gif"
                    style="margin: 5em"
                />
            </div>
        </div>

        <div id="footer">
            <div id="footer-text"></div>
        </div>

        <!-- Modern JS -->
        <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/runmode/runmode.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/mode/loadmode.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/meta.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/cypher/cypher.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/asciidoc.min.js"></script>

        <!-- MathJax -->
        <script>
            MathJax = {
                tex: {
                    inlineMath: [["\\\\(", "\\\\)"]],
                    displayMath: [["\\\\[", "\\\\]"]],
                    processEscapes: true,
                    processEnvironments: true,
                },
                options: {
                    ignoreHtmlClass: "nostem|nostem|nolatexmath",
                    processHtmlClass: ".*",
                },
            };
        </script>
        <script
            id="MathJax-script"
            async
            src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"
        ></script>

        <!-- Project specific JS -->
        <script src="js/asciidoctor-all.min.js"></script>
        <script src="js/base64.js"></script>
        <script src="js/gist.js"></script>
        <script src="js/docgist.js"></script>
        <script src="js/codemirror-asciidoc.js"></script>
        <script src="js/colorize.js"></script>
        <script src="js/uuid-1.4.7.js"></script>
        <script src="js/index-init.js"></script>

        <script>
            // Initialize CodeMirror mode URL
            CodeMirror.modeURL =
                "https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/%N/%N.min.js";
        </script>
    </body>
</html>
